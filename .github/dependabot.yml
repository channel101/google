version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      dev-dependencies:
        dependency-type: "development"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/example"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/example/android"
    schedule:
      interval: "weekly"
